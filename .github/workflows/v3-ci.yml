name: V3 Production Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily curation at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\"" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 27017:27017
      
      ollama:
        image: ollama/ollama:latest
        options: --cpus 2
        ports:
          - 11434:11434

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Wait for services
      run: |
        echo "Waiting for MongoDB..."
        until mongosh --host localhost:27017 --eval "db.adminCommand('ping')" &> /dev/null; do
          sleep 2
        done
        echo "MongoDB ready"
        
        echo "Waiting for Ollama..."
        for i in {1..30}; do
          if curl -s http://localhost:11434/api/tags > /dev/null; then
            echo "Ollama ready"
            break
          fi
          sleep 2
        done
    
    - name: Run unit tests
      run: |
        cd backend
        python -m pytest app/tests/test_exporter_thresholds.py -v --tb=short
      env:
        MONGODB_URL: mongodb://localhost:27017
        OLLAMA_BASE_URL: http://localhost:11434
    
    - name: Run integration tests (V3 endpoints)
      run: |
        cd backend
        python -m pytest app/tests/test_export_endpoints.py -v --tb=short
      env:
        MONGODB_URL: mongodb://localhost:27017
        OLLAMA_BASE_URL: http://localhost:11434
    
    - name: Run reproducibility tests
      run: |
        cd backend
        python -m pytest app/tests/test_reproducibility.py -v --tb=short
      env:
        MONGODB_URL: mongodb://localhost:27017
        OLLAMA_BASE_URL: http://localhost:11434
    
    - name: Run E2E workflow tests
      run: |
        cd backend
        python -m pytest app/tests/test_end_to_end_export.py -v --tb=short
      env:
        MONGODB_URL: mongodb://localhost:27017
        OLLAMA_BASE_URL: http://localhost:11434
    
    - name: Upload coverage reports
      if: always()
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella

  curation:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'  # Only run on scheduled trigger
    
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\"" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Run scheduled curation
      run: |
        python scripts/local_scheduled_curation.py
      env:
        MONGODB_URL: mongodb://localhost:27017
        CURATOR_RETENTION_DAYS: '60'
    
    - name: Upload golden dataset
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: golden-datasets
        path: datasets/golden_dataset_*.jsonl
        retention-days: 30

  quality-metrics:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate test summary
      run: |
        echo "# V3 Production Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Unit tests: ✓" >> $GITHUB_STEP_SUMMARY
        echo "- Integration tests: ✓" >> $GITHUB_STEP_SUMMARY
        echo "- Reproducibility tests: ✓" >> $GITHUB_STEP_SUMMARY
        echo "- E2E workflow tests: ✓" >> $GITHUB_STEP_SUMMARY
